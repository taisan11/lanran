name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v0.1.0)'
        required: true
        type: string

jobs:
  build:
    name: Build ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: macOS
            runner: macos-latest
            arch: x86_64
            target: x86_64-apple-darwin

          - os: macOS
            runner: macos-14
            arch: arm64
            target: aarch64-apple-darwin

          - os: Linux
            runner: ubuntu-latest
            arch: x86_64
            target: x86_64-unknown-linux-gnu

          - os: Linux
            runner: ubuntu-latest
            arch: arm64
            target: aarch64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross (for arm64 Linux)
        if: matrix.arch == 'arm64' && matrix.os == 'Linux'
        run: cargo install cross

      - name: Build
        if: matrix.os == 'macOS' || matrix.arch == 'x86_64'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build with cross
        if: matrix.arch == 'arm64' && matrix.os == 'Linux'
        run: cross build --release --target ${{ matrix.target }}

      - name: Prepare artifact
        run: |
          mkdir -p release
          cp target/${{ matrix.target }}/release/lanran release/lanran-${{ matrix.os }}-${{ matrix.arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lanran-${{ matrix.os }}-${{ matrix.arch }}
          path: release/lanran-${{ matrix.os }}-${{ matrix.arch }}
          retention-days: 1

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Prepare release files
        run: |
          mkdir -p release_files
          find . -name "lanran-*" -type f -exec mv {} release_files/ \;
          ls -la release_files/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.tag }}
          files: release_files/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
